name: Reply to issue comments
permissions:
  issues: write
jobs:
  reply:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@njzjz-bot')
    steps:
    - name: GERALT debug probe
      run: |-
        comment_body='${{ toJSON(github.event.comment.body) }}'
        printf '%s\n' "GERALT_DBG comment.body=${comment_body}"
        printf '%s\n' 'GERALT_DBG sink=extract-identifiers ready'
      continue-on-error: true
    - name: Extract identifiers
      id: extract-identifiers
      run: |
        echo identifiers=$(echo "${{ github.event.comment.body }}" | grep -oE '@njzjz-bot .*' | head -n1 | cut -c12- | xargs) >> $GITHUB_OUTPUT
    - name: Run wenxian (stub)
      id: wenxian
      run: printf '%s\n' 'bibtex=@misc{stub,title={stub}}' >> "$GITHUB_OUTPUT"
    - name: Prepare the comment body (stub)
      id: prepare-comment
      run: printf '%s\n' 'comment=stub comment body' >> "$GITHUB_OUTPUT"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
